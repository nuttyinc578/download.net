name: Validate source and submissions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: node scripts/build-web.mjs
      - run: dotnet build services/Api/Api.csproj -c Release
      - run: dotnet build services/AppHost/AppHost.csproj -c Release
      - run: node --test tests/*.test.mjs
      - run: go test ./...
        working-directory: services/bootstrap
      - run: javac --release 17 -d services/inspector/build services/inspector/ExeInspector.java
      - run: node scripts/validate-catalog.mjs
